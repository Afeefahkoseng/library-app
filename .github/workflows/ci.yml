name: Testing
on: push

jobs:
  test_project:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install requirements
      run: pip install -r requirements.txt
    - name: Run unit tests
      run: python manage.py test
